<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Penyelesaian dan Manajemen Konflik - Kelompok 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fc;--ink:#14192b;--ink2:#444d6b;--mut:#7a839f;--line:#e3e7f2;--card:#fff;--ac:#4f6bed;--ac2:#38bdf8;--sa:#4f6bed;--ok:#1f9d74;--bad:#e05a5a;--warn:#e08a2e;
--g:linear-gradient(135deg,#4f6bed 0%,#6f8cff 55%,#38bdf8 100%);
--sh:0 1px 2px rgba(20,25,43,.04),0 12px 32px -14px rgba(50,70,150,.22);--sh2:0 2px 4px rgba(20,25,43,.05),0 22px 44px -16px rgba(50,70,150,.32);
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;color:var(--ink);font:16px/1.6 Inter,"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;background:var(--bg)}
h1,h2,h3,p{margin:0}
button{font-family:inherit}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#c9d1ea 1px,transparent 1.2px);background-size:26px 26px;opacity:.55;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 40%,#000 15%,transparent 72%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:#cfd8ff}
.b2{width:40vmax;height:40vmax;right:-12vmax;bottom:-16vmax;background:#c6ecfa;animation-delay:-9s}
.b3{width:26vmax;height:26vmax;right:12vmax;top:-10vmax;background:#e6dcff;opacity:.38;animation-delay:-16s}
@keyframes drift{to{transform:translate(3vmax,2.4vmax) scale(1.08)}}
#deck{position:relative;height:100%;z-index:1}
.s{position:absolute;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;padding:calc(76px + 1vh) 5vw 88px;opacity:0;visibility:hidden;transform:translateX(18px) scale(.995);transition:opacity .45s,transform .45s,visibility .45s}
.s.on{opacity:1;visibility:visible;transform:none}
.w{margin:auto;width:100%;max-width:1060px}
.w.wide{max-width:1200px}
.c{text-align:center}
.a{opacity:0}
.s.on .a{opacity:1;animation:up .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*.07s + .05s)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.s{--sa:var(--ac)}
/* header slide */
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;margin-bottom:18px}
.hrow .hd{margin:0}.hrow .nar{margin:0 0 4px;max-width:min(500px,100%)}
.hd{margin-bottom:14px}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sa);background:color-mix(in srgb,var(--sa) 10%,#fff);border:1px solid color-mix(in srgb,var(--sa) 22%,#fff);padding:4px 12px 4px 10px;border-radius:99px;margin-bottom:8px}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--sa)}
h1,h2{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
h1{font-size:clamp(34px,6.2vw,70px);font-weight:800;line-height:1.06;letter-spacing:-.035em;margin:12px 0}
h2{font-size:clamp(26px,3.5vw,42px);font-weight:800;line-height:1.15;letter-spacing:-.03em;color:var(--ink)}
h3{font-size:17px;font-weight:700;margin-bottom:5px;letter-spacing:-.01em}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.mut{color:var(--mut)}
.sub{color:var(--ink2);margin-bottom:16px;max-width:760px}
.pn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s,border-color .25s}
.grid .pn:hover,.go:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--sa) 30%,var(--line))}
.pn p{color:var(--ink2);font-size:15px}
.ib{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--sa) 11%,#fff);color:var(--sa);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid.feat{grid-template-columns:1.25fr 1fr}
.grid.feat .pn:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--sa) 7%,#fff));padding:28px}
.grid.feat .pn:first-child h3{font-size:22px}
.grid.feat .pn:first-child p{font-size:17px}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}.grid.feat{grid-template-columns:1fr}.grid.feat .pn:first-child{grid-row:auto}}
@media(max-width:560px){.grid.c3,.grid.c4,.grid.c2{grid-template-columns:1fr}}
.callout{display:flex;gap:14px;align-items:flex-start;margin-top:18px;padding:16px 20px;border-radius:18px;background:color-mix(in srgb,var(--warn) 9%,#fff);border:1px solid color-mix(in srgb,var(--warn) 28%,#fff);color:var(--ink2)}
.callout .ic{flex:none;color:var(--warn);margin-top:2px}
.callout p{color:var(--ink2);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}.hint{display:none}}
/* cover */
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);font-size:13px;font-weight:600;color:var(--ink2)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stage{position:relative;height:120px;margin-bottom:6px}
.rg{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border-radius:50%;border:3px solid #7fd3b6;animation:rg 6s ease-out infinite}
@keyframes L{0%{opacity:0;transform:translateX(-42vw)}8%{opacity:1}34%{transform:translateX(-72px)}38%,42%{transform:translateX(-12px) scale(1.1)}58%,90%{opacity:1;transform:translateX(-26px)}100%{opacity:0;transform:translateX(-26px)}}
@keyframes R{0%{opacity:0;transform:translateX(42vw)}8%{opacity:1}34%{transform:translateX(72px)}38%,42%{transform:translateX(12px) scale(1.1)}58%,90%{opacity:1;transform:translateX(26px)}100%{opacity:0;transform:translateX(26px)}}
@keyframes rg{0%,36%{opacity:0;transform:scale(.6)}39%{opacity:.7}72%,100%{opacity:0;transform:scale(5)}}
.stage .ch{position:absolute;left:50%;top:50%;width:84px;margin:-62px 0 0 -42px}
.stage .ch.l{animation:L 6s ease-in-out infinite}.stage .ch.r{animation:R 6s ease-in-out infinite}
.mem{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:5px 15px 5px 5px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;box-shadow:var(--sh)}
.chip b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:700}
.cta{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}
/* agenda */
.go{display:flex;flex-direction:column;text-align:left;cursor:pointer;font:inherit;color:inherit}
.go .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.go .num{font:800 13px var(--mono);color:var(--mut)}
.go .arr{margin-top:auto;padding-top:10px;color:var(--sa);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;opacity:.0;transform:translateX(-4px);transition:.25s}
.go:hover .arr{opacity:1;transform:none}
/* stages */
.stg{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:8px}
.stg:before{content:"";position:absolute;left:10%;right:10%;top:21px;height:4px;border-radius:4px;background:linear-gradient(90deg,#4f8df0,#6f7df0,#a56fe0,#e08a5a,#3aa88a);opacity:.45}
.st{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.nd{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:800;margin-bottom:14px;box-shadow:0 6px 16px -6px var(--c)}
.st .pn{width:100%;flex:1;padding:16px}
.st .pn h3{font-size:16px}.st .pn p{font-size:14px}
@media(max-width:900px){.stg{grid-template-columns:1fr}.stg:before{left:21px;right:auto;top:20px;bottom:20px;width:4px;height:auto}.st{flex-direction:row;align-items:flex-start;text-align:left;gap:14px}.nd{margin:0;flex:none}}
/* vs */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.vs .pn{padding:26px}
.vs .good{background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--ok) 9%,#fff));border-color:color-mix(in srgb,var(--ok) 25%,#fff)}
.vs .bad{background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--bad) 8%,#fff));border-color:color-mix(in srgb,var(--bad) 22%,#fff)}
.vs .good .ib{background:color-mix(in srgb,var(--ok) 14%,#fff);color:var(--ok)}
.vs .bad .ib{background:color-mix(in srgb,var(--bad) 13%,#fff);color:var(--bad)}
.vs h3{font-size:20px}.vs p{font-size:16px}
.vsb{align-self:center;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--mut)}
@media(max-width:760px){.vs{grid-template-columns:1fr}.vsb{margin:auto}}
/* steps */
.spw{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
.spw.one{grid-template-columns:1fr}
@media(max-width:900px){.spw{grid-template-columns:1fr}}
.stp{position:relative;display:flex;flex-direction:column;gap:12px}
.stp:before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:linear-gradient(var(--sa),color-mix(in srgb,var(--sa) 25%,#fff))}
.sp{position:relative;display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center}
.sp .no{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--sa);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 18px -8px var(--sa);border:3px solid var(--bg)}
.sp .pn{padding:11px 18px}
.sp .pn h3{margin:0 0 1px;font-size:16px}.sp .pn p{font-size:14.5px}
.sp:hover .pn{transform:translateX(4px);box-shadow:var(--sh2)}
.tip{position:sticky;top:0;padding:26px;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--warn) 10%,#fff));border-color:color-mix(in srgb,var(--warn) 25%,#fff)}
.tip .ib{background:color-mix(in srgb,var(--warn) 15%,#fff);color:var(--warn)}
.tip p{font-size:16px;color:var(--ink2)}
/* spectrum */
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.spec{grid-template-columns:1fr}}
.axis{display:flex;align-items:center;gap:12px;margin:14px 2px 18px;font-size:12.5px;font-weight:600;color:var(--mut)}
.axis i{flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,#1aa6a0,#7ad0c9,#d6e9ee,#9aa8d8,#4f6bed)}
.fu h3{margin-bottom:10px}
.fchips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.fchips{grid-template-columns:repeat(2,1fr)}}
.fchips span{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--sa) 6%,#fff);border:1px solid color-mix(in srgb,var(--sa) 14%,#fff);font-size:14px;color:var(--ink2);line-height:1.4}
.fchips b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--sa);color:#fff;display:grid;place-items:center;font-size:11px}
/* map */
.map{position:relative;aspect-ratio:1.5;min-height:230px;border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;box-shadow:var(--sh)}
.map:before{content:"";position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 50%,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/50% 100%;opacity:.8}
.map:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.q{position:absolute;inset:0;background:radial-gradient(circle at 83% 16%,color-mix(in srgb,var(--ok) 12%,transparent),transparent 40%)}
.ax{position:absolute;font-size:11px;font-weight:600;color:var(--mut);pointer-events:none;letter-spacing:.02em}
.ax.y{left:12px;top:10px}.ax.x{right:12px;bottom:10px}
.dot{position:absolute;z-index:2;transform:translate(-50%,-50%);font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;cursor:pointer;transition:.25s;box-shadow:var(--sh)}
.dot:hover{border-color:var(--sa);transform:translate(-50%,-50%) scale(1.05)}
.dot.sel{background:var(--g);border-color:transparent;color:#fff;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 10px 24px -8px rgba(79,107,237,.6)}
.pop{animation:up .4s both}
#info h3{font-size:30px;margin-bottom:6px}
#info .tag{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--sa) 8%,#fff);font-size:14.5px;color:var(--ink2)}
/* simulasi */
.simg{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;align-items:start}
@media(max-width:860px){.simg{grid-template-columns:1fr}}
.mt{display:grid;gap:12px;margin-bottom:16px}
.ml{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2)}
.ml b{font-family:var(--mono);color:var(--ink)}
.bar{display:block;height:9px;border-radius:9px;background:#e9edf6;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:50%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
#mT i{background:linear-gradient(90deg,#f0a58a,#e05a5a)}#mH i{background:linear-gradient(90deg,#8fb0ff,#4f6bed)}#mR i{background:linear-gradient(90deg,#7fd8b9,#1f9d74)}
.chat{display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px dashed var(--line)}
.msg{display:flex;align-items:flex-end;gap:8px;animation:up .5s both}.msg.r{flex-direction:row-reverse}
.av{width:42px;flex:none}
.bub{max-width:86%;padding:8px 13px;border-radius:14px 14px 14px 4px;font-size:14.5px;background:#f4f6fc;border:1px solid var(--line);line-height:1.45}
.bub.r{border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--ac) 8%,#fff)}
.bub b{display:block;font-size:11.5px;color:var(--mut);margin-bottom:1px}
.rnd{display:flex;gap:6px;margin-bottom:10px}
.rnd i{height:5px;flex:1;border-radius:4px;background:#e3e7f2}.rnd i.on{background:var(--ac)}
.q-t{font-weight:700;font-size:16px;line-height:1.4}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-top:9px;cursor:pointer;transition:.2s;line-height:1.45}
.opt b{flex:none;width:24px;height:24px;border-radius:8px;background:#eef1fb;color:var(--ac);display:grid;place-items:center;font-size:12px}
.opt:hover{border-color:var(--ac);background:#f6f8ff;transform:translateX(3px)}
.opt.sel{background:var(--ac);border-color:var(--ac);color:#fff}.opt.sel b{background:rgba(255,255,255,.22);color:#fff}
.fb{margin-top:12px;padding:11px 15px;border-radius:14px;background:color-mix(in srgb,var(--ok) 9%,#fff);border:1px solid color-mix(in srgb,var(--ok) 25%,#fff);animation:up .4s both;font-size:14.5px;color:var(--ink2)}
/* tombol */
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;transition:.18s;box-shadow:0 1px 2px rgba(20,25,43,.04)}
.btn:hover{background:#f4f6fd;border-color:#cfd6ea}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--g);border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(79,107,237,.7)}
.btn.p:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* narator */
.nar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ch{flex:none;width:62px;overflow:visible}
.ey{transform-box:fill-box;transform-origin:center;animation:bl 4.6s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.wv{transform-origin:55px 52px;animation:wv 1.1s ease-in-out infinite alternate}
@keyframes wv{to{transform:rotate(-38deg)}}
.bb{position:relative;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:9px 16px;font-size:14.5px;font-weight:500;box-shadow:var(--sh)}
.bb:before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.xa{animation:xa 6s infinite}.xh{animation:xh 6s infinite}
@keyframes xa{0%,40%{opacity:1}46%,100%{opacity:0}}
@keyframes xh{0%,40%{opacity:0}46%,100%{opacity:1}}
.crew{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,2.4vw,26px);margin:20px 0}
.crew div{text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2)}.crew .ch{width:clamp(54px,8vw,78px);display:block;margin:0 auto 2px}
/* kesimpulan */
.big{padding:28px 26px}
.big .bn{font:800 44px/1 "Plus Jakarta Sans",Inter,sans-serif;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;margin-bottom:12px;letter-spacing:-.04em}
.big h3{font-size:20px}.big p{font-size:15.5px}
/* HUD & NAV */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(9px + env(safe-area-inset-top,0px)) 18px 9px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(227,231,242,.9);font-size:13px;font-weight:600;line-height:1.3}
#lg{width:34px;height:34px;border-radius:50%;flex:none}
#sec{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:var(--sa);font-weight:700}
#sec i{width:8px;height:8px;border-radius:50%;background:var(--sa)}
#cnt{font:600 12.5px var(--mono);color:var(--mut);background:#eef1f9;border-radius:99px;padding:3px 10px;border:0;cursor:pointer}
#cnt:hover{background:#e3e8f6}
.mb{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 11px;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 13.5px inherit;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:.18s}
.mb:hover{border-color:var(--ac);color:var(--ac)}
.mb kbd{font:600 11px var(--mono);padding:1px 6px;border-radius:6px;background:#eef1f9;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.8);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid rgba(227,231,242,.9)}
#seg{flex:1;max-width:760px;display:flex;align-items:center;gap:14px;height:28px}
.sgg{display:flex;gap:4px;align-items:center;flex:var(--n) 1 0;min-width:0}
.sg{position:relative;flex:1;height:7px;border:0;padding:0;border-radius:6px;background:#dde2f0;cursor:pointer;transition:height .18s,background .25s}
.sg.dn{background:color-mix(in srgb,var(--sa) 45%,#fff)}
.sg.cur{background:var(--sa);height:10px}
.sg:hover{height:12px;background:var(--sa)}
.sg:after{content:attr(data-t);position:absolute;bottom:20px;left:50%;transform:translate(-50%,4px);white-space:nowrap;padding:5px 10px;border-radius:9px;background:var(--ink);color:#fff;font:600 12px Inter,system-ui,sans-serif;opacity:0;pointer-events:none;transition:.15s;z-index:3}
.sg:hover:after{opacity:1;transform:translate(-50%,0)}
.sg:before{content:"";position:absolute;inset:-10px -2px}
#bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--g);z-index:25;transition:width .5s}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:.18s}
.ibtn:hover{border-color:var(--ac);color:var(--ac)}
/* drawer */
#ov{position:fixed;inset:0;z-index:29;background:rgba(20,25,43,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
#ov.open{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;left:0;bottom:0;width:min(400px,92vw);z-index:30;display:flex;flex-direction:column;background:rgba(255,255,255,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--line);box-shadow:30px 0 60px -20px rgba(20,25,43,.25);transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#dr.open{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.dh b{font:800 20px "Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.02em}
.dh small{display:block;color:var(--mut);font-size:12.5px;font-weight:500;margin-top:2px}
.srch{display:flex;align-items:center;gap:10px;margin:8px 16px 8px;padding:9px 14px;border-radius:14px;background:#f1f4fb;border:1px solid transparent;color:var(--mut)}
.srch:focus-within{background:#fff;border-color:var(--ac);color:var(--ac)}
.srch input{flex:1;border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink);outline:none;min-width:0}
#dl{flex:1;overflow-y:auto;padding:4px 12px 16px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 8px 6px;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--sa)}
.gh:after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--sa) 20%,#fff)}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:13px;border:0;background:transparent;font:inherit;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer;transition:background .15s}
.it:hover,.it:focus-visible{background:#f1f4fd}
.it.cur{background:color-mix(in srgb,var(--sa) 11%,#fff);font-weight:700}
.it .no{flex:none;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--sa) 11%,#fff);color:var(--sa);font:700 12px var(--mono);display:grid;place-items:center}
.it.cur .no{background:var(--sa);color:#fff}
.it .tg{margin-left:auto;flex:none;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--sa) 12%,#fff);color:var(--sa)}
.df{padding:12px 20px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.9}
.df kbd{font:600 11px var(--mono);padding:1px 6px;border-radius:6px;background:#eef1f9;color:var(--ink2);border:1px solid var(--line)}
.none{padding:30px 12px;text-align:center;color:var(--mut);font-size:14px}
/* ===== CODE LAB ===== */
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.lv{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 7px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--ink2);transition:.2s;text-align:left}
.lv:hover{border-color:var(--sa)}
.lv b{width:28px;height:28px;border-radius:9px;background:#eef1fb;color:var(--sa);display:grid;place-items:center;font-size:13px;transition:.2s}
.lv small{display:block;font-weight:500;font-size:11.5px;color:var(--mut);line-height:1.2}
.lv.on{background:color-mix(in srgb,var(--sa) 9%,#fff);border-color:var(--sa);color:var(--ink);box-shadow:0 8px 20px -12px var(--sa)}
.lv.on b{background:var(--sa);color:#fff}
.lv.ok b{background:var(--ok);color:#fff}
.mis{display:flex;gap:14px;align-items:center;padding:8px 18px;margin-bottom:14px}
.mis .ch{width:50px}
.mis p{font-size:14px;line-height:1.5}
.mis .an{margin-top:5px;font-size:13px;color:var(--mut)}
.mis .an b{color:var(--sa)}
.labg{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;align-items:stretch}
.ide{display:flex;flex-direction:column}
.ide .ibody{flex:1;min-height:150px}
@media(max-width:980px){.labg{grid-template-columns:1fr}}
.win{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.wbar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:#f6f8fd;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#d7dcea}
.dots i:nth-child(1){background:#f4a5a0}.dots i:nth-child(2){background:#f3d189}.dots i:nth-child(3){background:#9fd8b8}
.fn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink);padding:3px 10px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.sp1{flex:1}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut);user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:30px;height:17px;border-radius:99px;background:#d5dbea;transition:.2s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{transform:translateX(13px)}
.sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.ibody{display:flex;background:#fbfcff;min-height:0}
#gut{flex:none;width:44px;overflow:hidden;padding:12px 0 40px;background:#f3f5fb;border-right:1px solid var(--line);font:12px/20px var(--mono);color:#a3abc2;text-align:right;user-select:none}
#gut div{height:20px;padding-right:10px}
#gut .e{color:var(--bad);font-weight:700;background:rgba(224,90,90,.12)}
#gut .f{color:var(--ok);font-weight:700;background:rgba(31,157,116,.13)}
#gut .cl{color:var(--ac);font-weight:700}
.cw{position:relative;flex:1;min-width:0}
#hl,#ed{position:absolute;inset:0;margin:0;padding:12px 14px 40px;font:13px/20px var(--mono);white-space:pre;tab-size:2;-moz-tab-size:2;border:0;letter-spacing:0;word-spacing:0}
#hl{overflow:hidden;pointer-events:none;color:#2a3150}
#ed{overflow:auto;resize:none;background:transparent;color:transparent;caret-color:#14192b;outline:none;-webkit-text-fill-color:transparent}
#ed::selection{background:rgba(79,107,237,.22);-webkit-text-fill-color:transparent}
#hl .l{height:20px}
#hl .l.e{background:rgba(224,90,90,.1);box-shadow:inset 3px 0 0 var(--bad);margin:0 -14px;padding:0 14px}
#hl .l.f{background:rgba(31,157,116,.11);box-shadow:inset 3px 0 0 var(--ok);margin:0 -14px;padding:0 14px}
#hl i{font-style:normal}
#hl .h_t{color:#4f6bed}#hl .h_a{color:#c2570c}#hl .h_s{color:#12865c}#hl .h_k{color:#8b52e0}#hl .h_f{color:#2563eb}#hl .h_n{color:#d97706}#hl .h_c{color:#9aa4bd;font-style:italic}#hl .h_p{color:#0e7490}
.sbar{display:flex;justify-content:space-between;padding:5px 14px;background:#f6f8fd;border-top:1px solid var(--line);font:11.5px var(--mono);color:var(--mut)}
.tb{display:flex;flex-wrap:wrap;gap:8px;padding:9px 12px;border-top:1px solid var(--line);background:#fff;align-items:center}
.tb .sp1{flex:1}
.tb .btn{padding:6px 11px}
.kb{font:600 10.5px var(--mono);padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.07);margin-left:2px}
.btn.p .kb{background:rgba(255,255,255,.25)}
.hintbox{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid color-mix(in srgb,var(--warn) 25%,#fff);background:color-mix(in srgb,var(--warn) 9%,#fff);font-size:13.5px;color:var(--ink2);animation:up .35s both}
.hintbox .ic{flex:none;color:var(--warn);margin-top:2px}
.hintbox[hidden]{display:none}
#pv{display:block;width:100%;height:96px;border:0;background:#fff}
.url{flex:1;text-align:center;font:500 11.5px var(--mono);color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.rt{display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:4px;padding:8px 10px 0;background:#f6f8fd;border-bottom:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;color:var(--mut);background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ac)}
.tab em{font:700 11px var(--mono);font-style:normal;padding:1px 7px;border-radius:99px;background:#e6eaf6;color:var(--ink2)}
.tab em.bd{background:var(--bad);color:#fff}.tab em.gd{background:var(--ok);color:#fff}
.tab .sp1{flex:1}
.pbody{height:clamp(130px,calc(100vh - 590px),320px);overflow:auto;padding:10px 12px;font-size:13px}
#con{font:12px/1.5 var(--mono)}
.cr{display:flex;gap:9px;padding:5px 8px;border-radius:9px;margin-bottom:3px;word-break:break-word;animation:up .25s both}
.cr.log{color:var(--ink2)}.cr.info{color:var(--ac)}.cr.warn{color:#9a6212;background:#fff8ec}
.cr.error{color:#b83a3a;background:#fff1f1}.cr.sys{color:var(--mut)}
.cr .gl{flex:none;width:12px;text-align:center;font-weight:700}
.cr .ln{margin-left:auto;flex:none;font:600 11px Inter,system-ui,sans-serif;color:#b83a3a;background:#fde0e0;border:0;border-radius:99px;padding:1px 9px;cursor:pointer;height:20px}
.cr .ln:hover{background:#fbcaca}
.cr .ex{display:block;margin-top:2px;font:12.5px Inter,system-ui,sans-serif;color:var(--ink2)}
.empty{display:grid;place-items:center;height:100%;color:var(--mut);text-align:center;font-size:13px;gap:6px}
.tr{display:flex;gap:11px;align-items:flex-start;padding:8px 8px;border-radius:12px;margin-bottom:4px}
.tr .ti{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9edf6;color:var(--mut);font-size:12px;font-weight:800;margin-top:1px}
.tr.ok .ti{background:var(--ok);color:#fff}.tr.no .ti{background:var(--bad);color:#fff}
.tr.run .ti{background:#fff;border:2px solid var(--ac);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tr b{font-size:13.5px;font-weight:600;color:var(--ink)}
.tr.no{background:#fff5f5}.tr.ok{background:#f3fbf7}
.tr small{display:block;color:#b83a3a;font-size:12.5px;margin-top:1px;line-height:1.4}
.tsum{display:flex;align-items:center;gap:10px;margin:2px 4px 10px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tsum .bar{flex:1;margin:0}.tsum .bar i{background:linear-gradient(90deg,#7fd8b9,#1f9d74);width:0}
.win-ok{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:2px 0 8px;padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 12%,#fff),#fff);border:1px solid color-mix(in srgb,var(--ok) 30%,#fff);animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.win-ok .btn{flex:none}.win-ok .fin{flex:none;color:#126b4f;font-size:13px}
.win-ok h4{margin:0 0 2px;font-size:15px;color:#126b4f;display:flex;align-items:center;gap:8px}
.win-ok p{font-size:12.5px;line-height:1.45;color:var(--ink2);margin:0}
@media(prefers-reduced-motion:reduce){*,.blob{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
@media(max-width:700px){.mb span,.mb kbd,#lgt{display:none}.mb{padding:8px}nav{gap:8px;padding-left:10px;padding-right:10px}#seg{gap:8px}.ide .ibody{min-height:230px}}
@media(max-width:480px){.btn{padding:7px 12px;font-size:13px}#sec span{display:none}.kb{display:none}}

@media(min-width:1500px){.w{max-width:1240px}.w.wide{max-width:1400px}.pn p,.sp .pn p,.st .pn p{font-size:16.5px}h3{font-size:19px}.sub{font-size:18px}.bb{font-size:16px}.opt,.bub,.fb{font-size:16px}.ibody{font-size:14px}#hl,#ed{font-size:14px}.mis p{font-size:15.5px}.tr b{font-size:14.5px}#con{font-size:13px}.map{aspect-ratio:1.6}}
@media(min-width:1800px){.w{max-width:1360px}.w.wide{max-width:1560px}h2{font-size:48px}}

</style>
</head>

el:function(s){var e=document.querySelector(s);if(!e)throw new Error('Elemen '+s+' tidak ditemukan. Cek id-nya.');return e},
text:function(s){return T.el(s).textContent.trim()},
click:function(s){var n=E;T.el(s).click();if(E>n)throw new Error('Klik '+s+' memunculkan error: '+LE)}};
addEventListener('load',function(){P({k:'ready'})});
addEventListener('message',function(ev){var d=ev.data;if(!d||d.t!=='tests')return;var i=0;
(function next(){if(i>=d.list.length){P({k:'done'});return}
var k=i++,f;P({k:'run',i:k});
try{f=new Function('T','return (async function(){'+d.list[k]+'})()')(T)}catch(x){f=Promise.reject(x)}
f.then(function(){P({k:'res',i:k,ok:true})},function(x){P({k:'res',i:k,ok:false,msg:String(x&&x.message||x)})}).then(next)})()});
}
const BASE='*{box-sizing:border-box}body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:14px;margin:0;color:#1e2430;background:#fff}button{font:inherit;font-weight:600;padding:8px 14px;border:0;border-radius:10px;background:#4f6bed;color:#fff;cursor:pointer;margin:0 6px 0 0}button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}input{font:inherit;padding:7px 10px;border:1px solid #ccd3e0;border-radius:9px;width:90px;margin-right:8px}p{margin:12px 0 0}b{font-size:20px}';
const PRE='<!doctype html><meta charset="utf-8"><style>'+BASE+'</style><body><script>('+HARN.toString()+')()'+SC+'\n';
const PRE_LINES=PRE.split('\n').length-1;
/* ----- State & elemen ----- */
const ed=$('#ed'),hl=$('#hl'),gut=$('#gut'),pv=$('#pv'),pb=$('#pb'),hb=$('#hb');
const LS={i:0,code:LV.map(l=>l.code),done:LV.map(()=>false),hint:LV.map(()=>0),ready:false,pend:false,tab:'c',err:0,fix:new Set(),con:[],res:[],running:false,finished:false,ft:0};
const lv=()=>LV[LS.i];
function renderCode(){const st={scr:false,blk:false},ls=ed.value.split('\n');
hl.innerHTML=ls.map((l,i)=>'<div class="l'+(LS.err==i+1?' e':'')+(LS.fix.has(i+1)?' f':'')+'">'+hlLine(l,st)+'</div>').join('');
gut.innerHTML=ls.map((_,i)=>'<div class="'+(LS.err==i+1?'e':LS.fix.has(i+1)?'f':'')+'">'+(i+1)+'</div>').join('');
hl.scrollTop=gut.scrollTop=ed.scrollTop;hl.scrollLeft=ed.scrollLeft}
function pos(){const v=ed.value.slice(0,ed.selectionStart).split('\n');$('#pos').textContent='Baris '+v.length+', Kol '+(v[v.length-1].length+1)}
function goLine(n){const ls=ed.value.split('\n');let a=0;for(let i=0;i<n-1;i++)a+=ls[i].length+1;ed.focus();ed.setSelectionRange(a,a+(ls[n-1]||'').length);ed.scrollTop=Math.max(0,(n-3)*20);renderCode();pos()}
ed.addEventListener('scroll',()=>{hl.scrollTop=gut.scrollTop=ed.scrollTop;hl.scrollLeft=ed.scrollLeft});
['keyup','click','select','focus'].forEach(ev=>ed.addEventListener(ev,pos));
/* ----- Tab level ----- */
function renderLv(){$('#lvls').innerHTML=LV.map((l,i)=>'<button class="lv'+(i==LS.i?' on':'')+(LS.done[i]?' ok':'')+'" data-lv="'+i+'"><b>'+(LS.done[i]?'✓':i+1)+'</b><span>'+l.n+'<small>'+(LS.done[i]?'Selesai':l.sub)+'</small></span></button>').join('');
$('#mis').innerHTML=AST(LS.done[LS.i]?'#3a9d7a':'#d9a441',LS.done[LS.i]?'s':'t')+'<div><p><b>Misi '+(LS.i+1)+': '+esc(lv().n)+'.</b> '+esc(lv().mis)+'</p><p class="an"><b>Analogi konflik:</b> '+esc(lv().an)+'</p></div>'}
$('#lvls').onclick=e=>{const b=e.target.closest('.lv');if(b)setLevel(+b.dataset.lv)};
function setLevel(i){LS.code[LS.i]=ed.value;LS.i=i;LS.err=0;LS.fix=new Set();LS.res=[];LS.finished=false;ed.value=LS.code[i];renderLv();updHint(true);renderCode();pos();run();tab('c')}
/* ----- Jalankan ----- */
function run(test){LS.ready=false;LS.pend=!!test;LS.err=0;LS.con=[];LS.res=lv().tests.map(()=>({s:'w'}));LS.finished=false;renderCode();rcon();
pv.srcdoc=PRE+ed.value}
function startTests(){LS.running=true;LS.res=lv().tests.map(()=>({s:'w'}));rtests();pv.contentWindow.postMessage({t:'tests',list:lv().tests.map(t=>t[1])},'*')}
function explain(m){let x;
if(x=/(\w+) is not defined/.exec(m))return 'Nama “'+x[1]+'” belum didefinisikan: tidak ada fungsi atau variabel dengan nama itu di kode.';
if(/Cannot (set|read) propert/.test(m))return 'Kode mencoba memakai sesuatu yang null. Biasanya elemen dengan id tersebut tidak ditemukan di halaman.';
if(/SyntaxError/.test(m))return 'Ada penulisan yang salah, misalnya tanda kurung, kutip, atau kurung kurawal yang tidak berpasangan.';
if(/is not a function/.test(m))return 'Yang dipanggil bukan fungsi. Cek lagi nama dan ejaannya.';return ''}
addEventListener('message',e=>{if(e.source!==pv.contentWindow||!e.data)return;const d=e.data;
if(d.k=='ready'){LS.ready=true;if(LS.pend){LS.pend=false;startTests()}}
else if(d.k=='err'){const ls=ed.value.split('\n');let line=0,m=/(\w+) is not defined/.exec(d.msg);
 if(m){const re=new RegExp('\\b'+m[1]+'\\b');line=ls.findIndex(l=>re.test(l))+1}
 if(!line&&d.line){const n=d.line-PRE_LINES;if(n>=1&&n<=ls.length)line=n}
 if(line&&!LS.err){LS.err=line;renderCode()}
 const lc=LS.con[LS.con.length-1];if(lc&&lc.lv=='error'&&lc.txt==d.msg)lc.n=(lc.n||1)+1;else LS.con.push({lv:'error',txt:d.msg,line:line,ex:explain(d.msg)});rcon()}
else if(d.k=='log'){LS.con.push({lv:d.lv,txt:d.txt});rcon()}
else if(d.k=='run'){LS.res[d.i]={s:'r'};rtests()}
else if(d.k=='res'){LS.res[d.i]={s:d.ok?'p':'f',msg:d.msg};rtests()}
else if(d.k=='done'){LS.running=false;LS.finished=true;const ok=LS.res.every(x=>x.s=='p');if(ok&&!LS.done[LS.i]){LS.done[LS.i]=true;renderLv()}rtests()}});
/* ----- Panel konsol & uji ----- */
function tab(t){LS.tab=t;$('#tc').classList.toggle('on',t=='c');$('#tt').classList.toggle('on',t=='t');t=='c'?rcon():rtests()}
$('#tc').onclick=()=>tab('c');$('#tt').onclick=()=>tab('t');
$('#cc').onclick=()=>{LS.con=[];LS.err=0;renderCode();rcon();tab('c')};
function rcon(){const n=LS.con.filter(x=>x.lv=='error').length,ce=$('#ce');ce.textContent=LS.con.length;ce.className=n?'bd':'';
if(LS.tab!='c')return;
pb.id='con';pb.innerHTML=LS.con.length?LS.con.slice(-60).map((x,i)=>'<div class="cr '+x.lv+'"><span class="gl">'+(x.lv=='error'?'✕':x.lv=='warn'?'!':'›')+'</span><span style="flex:1">'+esc(x.txt)+(x.n>1?' <b>×'+x.n+'</b>':'')+(x.ex?'<span class="ex">'+esc(x.ex)+'</span>':'')+'</span>'+(x.line?'<button class="ln" data-ln="'+x.line+'">baris '+x.line+'</button>':'')+'</div>').join(''):'<div class="empty"><div>'+ic('term',22)+'<br>Belum ada pesan.<br>Klik tombol di pratinjau atau tekan Uji kode, error akan muncul di sini.</div></div>';
pb.scrollTop=pb.scrollHeight}
pb.addEventListener('click',e=>{const b=e.target.closest('[data-ln]');if(b)goLine(+b.dataset.ln)});
function rtests(){const ts=lv().tests,p=LS.res.filter(x=>x.s=='p').length,te=$('#te');te.textContent=p+'/'+ts.length;te.className=LS.finished?(p==ts.length?'gd':'bd'):'';
if(LS.tab!='t')return;pb.id='tp';
const all=LS.finished&&p==ts.length;
let h='<div class="tsum"><span>'+p+' dari '+ts.length+' uji lolos</span><span class="bar"><i style="width:'+(p/ts.length*100)+'%"></i></span></div>';
if(all)h+='<div class="win-ok"><div><h4>'+ic('check',18)+'Semua uji lolos</h4><p>'+esc(lv().ok)+'</p></div>'+(LS.i<LV.length-1?'<button class="btn p sm" id="nl">Level berikutnya'+ic('arrow',14)+'</button>':'<b class="fin">Semua level selesai. Mantap!</b>')+'</div>';
h+=ts.map((t,i)=>{const r=LS.res[i]||{s:'w'},cls=r.s=='p'?'ok':r.s=='f'?'no':r.s=='r'?'run':'';
return '<div class="tr '+cls+'"><span class="ti">'+(r.s=='p'?'✓':r.s=='f'?'✕':r.s=='r'?'':'')+'</span><div><b>'+esc(t[0])+'</b>'+(r.s=='f'&&r.msg?'<small>'+esc(r.msg)+'</small>':'')+'</div></div>'}).join('');
pb.innerHTML=h;if(all)pb.scrollTop=0;const nl=$('#nl');if(nl)nl.onclick=()=>setLevel(LS.i+1)}
/* ----- Petunjuk, solusi, reset ----- */
function updHint(clear){const h=LS.hint[LS.i],n=lv().hints.length;$('#hn').textContent='Petunjuk'+(h?' ('+h+'/'+n+')':'');
if(clear||!h){hb.hidden=true;return}hb.hidden=false;hb.innerHTML=ic('bulb',17)+'<div><b>Petunjuk '+h+' dari '+n+'.</b> '+esc(lv().hints[h-1])+'</div>'}
$('#hnt').onclick=()=>{LS.hint[LS.i]=LS.hint[LS.i]%lv().hints.length+1;updHint()};
$('#sol').onclick=()=>{const old=ed.value.split('\n'),nw=lv().fix.split('\n');LS.fix=new Set();nw.forEach((l,i)=>{if(old[i]!==l)LS.fix.add(i+1)});
ed.value=lv().fix;LS.code[LS.i]=ed.value;hb.hidden=false;hb.innerHTML=ic('sparkle',17)+'<div><b>Solusi dimuat.</b> Baris berwarna hijau adalah yang diubah. Klik Uji kode untuk memastikan.</div>';run(true);tab('t')};
$('#rst').onclick=()=>{ed.value=lv().code;LS.code[LS.i]=ed.value;LS.hint[LS.i]=0;LS.fix=new Set();updHint(true);run();tab('c')};
$('#run').onclick=()=>{run();tab('c')};
$('#rl').onclick=()=>run();
$('#tst').onclick=()=>{run(true);tab('t')};
/* ----- Editor: input, tab, enter, auto-run ----- */
let at=0;
ed.addEventListener('input',()=>{LS.code[LS.i]=ed.value;LS.err=0;LS.fix=new Set();renderCode();pos();if($('#auto').checked){clearTimeout(at);at=setTimeout(()=>run(),700)}});
const ins=t=>{if(!document.execCommand('insertText',false,t)){ed.setRangeText(t,ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input'))}};
ed.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey)&&e.key=='Enter'){e.preventDefault();run();tab('c');return}
if(e.key=='Tab'){e.preventDefault();const v=ed.value,a=ed.selectionStart,b=ed.selectionEnd;
 if(a!=b&&v.slice(a,b).includes('\n')||e.shiftKey){const s=v.lastIndexOf('\n',a-1)+1;let en=v.indexOf('\n',b);if(en<0)en=v.length;
  const blk=v.slice(s,en),nb=e.shiftKey?blk.replace(/^( {1,2}|\t)/gm,''):blk.replace(/^/gm,'  ');
  ed.setSelectionRange(s,en);ins(nb);ed.setSelectionRange(s,s+nb.length)}
 else ins('  ');return}
if(e.key=='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const v=ed.value,a=ed.selectionStart,s=v.lastIndexOf('\n',a-1)+1,ind=/^[ \t]*/.exec(v.slice(s,a))[0],pr=v.slice(s,a).trimEnd();
 const more=/[{(\[]$/.test(pr)||/^<(script|div|ul|ol|body|main|section)[^>]*>$/i.test(pr.trim())?'  ':'';ins('\n'+ind+more)}});
/* ----- Mulai ----- */
ed.value=lv().code;renderLv();updHint(true);renderCode();pos();run();rtests();


go(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
